# ========== CONFIGURACION DEL SERVIDOR ==============
server.port=8082
spring.application.name=order-service

# ========== CONFIGURACION DE LA BASE DE DATOS ==========
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver=com.mysql.cj.jdbc.Driver

# ========== CONFIGURACION DE JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== CONFIGURACION DE EUREKA ==========
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ==========  FEIGN + CIRCUIT BREAKER
feign.circuitbreaker.enabled=true

# ========== RESILIENCE4J - CIRCUIT BREAKER
resilience4j.circuitbreaker.instances.inventarioService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventarioService.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.inventarioService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventarioService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventarioService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventarioService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventarioService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventarioService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventarioService.minimumNumberOfCalls=5

# ========== RESILIENCE4J - RETRY
resilience4j.retry.instances.inventarioService.max-attempts=3
resilience4j.retry.instances.inventarioService.wait-duration=5s

# ========== CONFIGURACION KAFKA
# Servidores de Kafka
spring.kafka.bootstrap-servers=localhost:9092
# Topic por defecto para KafkaTemplate
spring.kafka.template.default-topic=notificationTopic
# Serializadores del Productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Mapeo de Tipos (JsonSerializer). La clave debe ir entre corchetes [] porque contiene puntos
spring.kafka.producer.properties[spring.json.type.mapping]=event:com.msvc.order.event.OrderPlacedEvent
