# ========== CONFIGURACION DEL SERVIDOR ==============
server.port=8085
spring.application.name=notification-service

# ========== CONFIGURACION DE EUREKA ==========
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ========== CONFIGURACION KAFKA ==========
# Dirección del broker de Kafka
spring.kafka.bootstrap-servers=localhost:9092
# CONFIGURACIÓN DEL CONSUMIDOR. Grupo de consumidores al que pertenece este servicio
spring.kafka.consumer.group-id=notificationId
# Deserializador para la CLAVE del mensaje (String)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Deserializador para el VALOR del mensaje (JSON → Objeto Java)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Propiedades adicionales del deserializador JSON. La clave va entre corchetes [] porque contiene puntos
spring.kafka.consumer.properties[spring.json.type.mapping]=event:com.msvc.notification.event.OrderPlacedEvent
# Permite deserializar a clases sin que estén en el classpath (evita errores)
spring.kafka.consumer.properties[spring.json.trusted.packages]=*

# ===== CONFIGURACION PROMETHEUS
management.endpoints.web.exposure.include=health,info,prometheus